services:
  app:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://media:media@postgres:5432/media
      PORT: "3000"
      MEDIA_ROOT: /media
      # Directories the folder picker is allowed to browse and scan.
      BROWSE_ROOTS: /media,/host/home,/host/volumes
      BACKUP_DIR: /app/backups
      APP_DATA_DIR: /app/app-data
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:5173,http://localhost:3000}
      # This machine's address on the wifi, for Settings → Privacy to show a
      # phone. Filled in by docker/with-lan-host.sh when started through
      # `sh docker/with-lan-host.sh docker compose up -d`.
      LAN_HOST: ${LAN_HOST:-}
    volumes:
      # Kept for compatibility with an existing library: paths already in the
      # database are /media/..., so this must stay pointed where it was.
      - ${MEDIA_ROOT:-./media-placeholder}:/media:ro
      # Browsable roots, read-only. Without these the container simply cannot
      # see the host filesystem, so the folder picker would have nothing to
      # offer beyond the single mount above.
      - ${HOME_ROOT:-${HOME:-/Users}}:/host/home:ro
      - /Volumes:/host/volumes:ro
      # The one writable bind mount. Point BACKUP_DIR at an external drive or
      # a synced folder to survive disk failure, not just a wiped volume.
      - ${BACKUP_DIR:-../backups}:/app/backups
      - app-data:/app/app-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    # Deliberately not published to the host: the app reaches it over the
    # compose network, and a fixed host port 5432 collides with any Postgres
    # already running on the machine. docker-compose.dev.yml publishes it for
    # development.
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
      POSTGRES_DB: media
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  app-data:
